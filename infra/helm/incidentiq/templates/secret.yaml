{{- if .Values.secret.enabled -}}
{{- $mode := default "raw" .Values.secret.mode -}}
{{- if eq $mode "raw" -}}
apiVersion: v1
kind: Secret
metadata:
  name: incidentiq-secrets
  namespace: {{ .Values.namespace }}
  labels:
    {{- include "incidentiq.labels" . | nindent 4 }}
type: Opaque
stringData:
{{- range $key, $value := .Values.secret.stringData }}
  {{ $key }}: {{ $value | quote }}
{{- end }}
{{- end }}
{{- if eq $mode "sealed" -}}
apiVersion: bitnami.com/v1alpha1
kind: SealedSecret
metadata:
  name: incidentiq-secrets
  namespace: {{ .Values.namespace }}
  labels:
    {{- include "incidentiq.labels" . | nindent 4 }}
spec:
  encryptedData:
{{- range $key, $value := .Values.secret.stringData }}
    {{ $key }}: "{{ $value }}"
{{- end }}
  template:
    metadata:
      name: incidentiq-secrets
      namespace: {{ .Values.namespace }}
      labels:
        {{- include "incidentiq.labels" . | nindent 8 }}
    type: Opaque
{{- end }}
{{- end }}