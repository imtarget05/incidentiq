name = "ai-knowledge-mcp"
main = "src/index.ts"
compatibility_date = "2026-11-08"

[[d1_databases]]
binding = "DB"
database_name = "ai-knowledge-platform"
database_id = "aa3e2700-ccdc-4ab5-af89-abd5f3b01d26"

[[vectorize]]
binding = "VECTORIZE_INDEX"
index_name = "ai-knowledge-vectors"

[ai]
binding = "AI"

[observability]
enabled = true

# Service binding: same-account Worker-to-Worker calls over a public URL are
# rejected with Cloudflare error 1042, so route API calls through the binding.
[[services]]
binding = "API"
service = "ai-knowledge-platform"

[vars]
API_WORKER_URL = "https://ai-knowledge-platform.tanmainguyenbinh.workers.dev"
