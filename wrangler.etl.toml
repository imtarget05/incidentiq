name = "ai-knowledge-etl"
main = "api/src/etl_consumer.py"
compatibility_date = "2026-11-08"
compatibility_flags = ["python_workers"]

[[d1_databases]]
binding = "DB"
database_name = "ai-knowledge-platform"
database_id = "aa3e2700-ccdc-4ab5-af89-abd5f3b01d26"

# Vectorize bindings reference the index by NAME, not by ID.
[[vectorize]]
binding = "VECTORIZE_INDEX"
index_name = "ai-knowledge-vectors"

[[queues.consumers]]
queue = "etl-queue"
max_batch_size = 10
max_batch_timeout = 30
max_retries = 3
dead_letter_queue = "etl-dlq"

# Producer bindings: the consumer re-enqueues transient failures to ETL_QUEUE
# (attempt backoff) and dead-letters exhausted jobs to ETL_DLQ. Without these,
# retry()/send() fail silently and messages loop on platform retries.
[[queues.producers]]
binding = "ETL_QUEUE"
queue = "etl-queue"

[[queues.producers]]
binding = "ETL_DLQ"
queue = "etl-dlq"

[observability]
enabled = true

[ai]
binding = "ai"
