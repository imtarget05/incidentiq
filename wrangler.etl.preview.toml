# Isolated Cloudflare preview queue consumer; points only at preview resources.
name = "incidentiq-etl-preview"
main = "api/src/etl_consumer.py"
compatibility_date = "2026-11-08"
compatibility_flags = ["python_workers"]
workers_dev = true

[[d1_databases]]
binding = "DB"
database_name = "incidentiq-preview"
database_id = "8e1a7127-b9d3-43fc-82ff-c2dca620c82f"

[[vectorize]]
binding = "VECTORIZE_INDEX"
index_name = "ai-knowledge-vectors-preview"

[[queues.consumers]]
queue = "etl-queue-preview"
max_batch_size = 10
max_batch_timeout = 30
max_retries = 3
dead_letter_queue = "etl-dlq-preview"

[observability]
enabled = true

[ai]
binding = "ai"
