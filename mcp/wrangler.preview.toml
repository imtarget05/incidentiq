# Isolated Cloudflare preview MCP worker; points only at preview resources.
name = "incidentiq-mcp-preview"
main = "src/index.ts"
compatibility_date = "2026-11-08"
workers_dev = true

[[d1_databases]]
binding = "DB"
database_name = "incidentiq-preview"
database_id = "8e1a7127-b9d3-43fc-82ff-c2dca620c82f"

[[vectorize]]
binding = "VECTORIZE_INDEX"
index_name = "ai-knowledge-vectors-preview"

[ai]
binding = "AI"

[observability]
enabled = true

# Service binding: same-account Worker-to-Worker calls over a public URL are
# rejected with Cloudflare error 1042, so route API calls through the binding.
[[services]]
binding = "API"
service = "incidentiq-preview"

[vars]
API_WORKER_URL = "https://incidentiq-preview.tanmainguyenbinh.workers.dev"
