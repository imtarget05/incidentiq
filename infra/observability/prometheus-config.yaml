global:
  scrape_interval: 15s
  evaluation_interval: 15s
  external_labels:
    cluster: incidentiq-prod
    environment: production

alerting:
  alertmanagers:
    - static_configs:
        - targets:
          - alertmanager:9093

rule_files:
  - /etc/prometheus/rules/*.yaml

scrape_configs:
  - job_name: prometheus
    static_configs:
      - targets: ["localhost:9090"]
  - job_name: incidentiq-api
    static_configs:
      - targets: ["incidentiq-api:8000"]
