# Isolated Cloudflare preview resources. This file must never use production IDs.
name = "incidentiq-preview"
main = "api/src/main.py"
compatibility_date = "2026-11-08"
compatibility_flags = ["python_workers"]
workers_dev = true

[[d1_databases]]
binding = "DB"
database_name = "incidentiq-preview"
database_id = "8e1a7127-b9d3-43fc-82ff-c2dca620c82f"

[[vectorize]]
binding = "VECTORIZE_INDEX"
index_name = "ai-knowledge-vectors-preview"

[[queues.producers]]
binding = "ETL_QUEUE"
queue = "etl-queue-preview"

[[queues.producers]]
binding = "ETL_DLQ"
queue = "etl-dlq-preview"

[assets]
directory = "./web"
binding = "ASSETS"
not_found_handling = "none"
run_worker_first = true

[observability]
enabled = true

[vars]
ETL_MODE = "queue"

[ai]
binding = "ai"
