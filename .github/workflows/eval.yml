name: "4. Eval & Regression (IncidentIQ Option B)"

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:
    inputs:
      base_url:
        description: "Live IncidentIQ API base URL (fixture job always uses fakes)"
        required: false
        default: ""

jobs:
  fixture-smoke:
    name: "Fixture Smoke Test (Mock Stack)"
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install API dependencies
        run: pip install -r api/requirements.txt
      - name: Run fake-backed golden evaluation
        run: python scripts/eval_harness.py
      - name: Upload report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: incidentiq-eval-report
          path: docs/evaluation.md
          retention-days: 30

  live-benchmark:
    name: "Live Retrieval & LLM Benchmark"
    if: ${{ inputs.base_url != '' }}
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install dependencies
        run: pip install requests
      - name: Run live benchmark
        env:
          BASE_URL: ${{ inputs.base_url }}
        run: |
          python eval/run_live_benchmark.py --base-url "$BASE_URL" \
            --questions eval/golden_dataset.json \
            --output eval/results/live_benchmark.json
      - name: Upload live benchmark report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: incidentiq-live-benchmark-report
          path: eval/results/live_benchmark.json
          retention-days: 30
