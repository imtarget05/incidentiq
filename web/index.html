<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>AI Knowledge Platform</title>
<link rel="stylesheet" href="style.css">
</head>
<body>
<header class="bar">
  <div class="brand">AI Knowledge Platform</div>
  <div class="status" id="status">─</div>
</header>

<main class="wrap">
  <section class="panel">
    <h2>Tải tài liệu lên</h2>
    <div class="form-row">
      <input type="file" id="fileInput" accept=".txt,.md">
      <button id="btnUpload">Tải lên</button>
    </div>
    <div id="uploadMsg" class="msg"></div>
  </section>

  <section class="panel">
    <h2>Đặt câu hỏi</h2>
    <div class="form-row">
      <input type="text" id="questionInput" placeholder="Nhập câu hỏi...">
      <button id="btnAsk">Gởi</button>
    </div>
    <div id="answer" class="answer"></div>
    <div id="citations" class="citations"></div>
  </section>

  <section class="panel">
    <h2>Tạo sự cố (incident)</h2>
    <div class="form-row">
      <input type="text" id="incTitle" placeholder="Tiêu đề sự cố">
      <input type="text" id="incSeverity" placeholder="Severity (CRITICAL/HIGH/MEDIUM/LOW)">
    </div>
    <div class="form-row">
      <input type="text" id="incService" placeholder="Dịch vụ (payment-api)">
      <input type="text" id="incEnv" placeholder="Môi trường (prod)">
    </div>
    <div class="form-row">
      <input type="text" id="incIdem" placeholder="Idempotency-Key (vd: inc-001)">
      <button id="btnCreateInc">Tạo sự cố</button>
    </div>
    <div id="incMsg" class="msg"></div>
    <div id="incResult" class="msg"></div>
  </section>

  <section class="panel">
    <h2>Chi tiết &amp; timeline sự cố</h2>
    <div class="form-row">
      <input type="text" id="incLookupId" placeholder="ID sự cố">
      <button id="btnLookupInc">Xem</button>
    </div>
    <div id="incDetail"></div>
    <ul id="incTimeline"></ul>
  </section>

  <section class="panel">
    <h2>Tài liệu của bạn</h2>
    <button id="btnList">Làm mới danh sách</button>
    <ul id="docList"></ul>
  </section>
</main>

<script src="app.js"></script>
</body>
</html>
